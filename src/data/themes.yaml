- id: amr-genomics
  title: AMR and bacterial genomics
  summary: >-
    I connect wet-lab microbiology with genome analysis to study antimicrobial
    resistance and the diversity of bacterial populations.
  methods:
    - Microbiology
    - Genome analysis
    - Comparative genomics
    - Scientific visualisation

- id: drug-discovery
  title: Computational drug discovery
  summary: >-
    I bring together molecular modelling and machine learning to investigate
    natural products and disease-linked protein targets.
  methods:
    - Molecular docking
    - Molecular dynamics
    - Virtual screening
    - Cheminformatics

- id: multi-omics
  title: Multi-omics and network biology
  summary: >-
    I integrate gene expression and DNA methylation data, using network biology
    and statistical analysis to explore disease-associated patterns.
  methods:
    - Transcriptomics
    - DNA methylation
    - Network analysis
    - Biostatistics
